    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      --silver: #e8e9eb;
      --muted: #a8abb1;
      --line: rgba(255, 255, 255, .18);
      --glass: rgba(18, 19, 22, .82);
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      background: transparent;
    }

    body {
      display: grid;
      place-items: center;
      padding: 12px;
      overflow: hidden;
    }

      filter: grayscale(1) drop-shadow(0 0 20px rgba(255,255,255,.18));
      pointer-events: none;
    }

    .shine {
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(115deg, transparent 15%, rgba(255,255,255,.08) 38%, transparent 54%);
      transform: translateX(-100%);
      animation: shine 7s ease-in-out infinite;
      pointer-events: none;
    }

    .content {
      display: grid;
      grid-template-columns: 132px 1fr;
      gap: 20px;
      padding: 26px;
    }

    .cover {
      position: relative;
      width: 132px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: linear-gradient(145deg, #f5f5f5, #777 42%, #17191d 70%);
      box-shadow: 0 12px 30px rgba(0,0,0,.36), inset 0 0 0 7px rgba(0,0,0,.22);
    }

    .cover::after {
      content: "";
      position: absolute;
      inset: 9px;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: inherit;
      pointer-events: none;
    }

    #sonic_art {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
    }

    #sonic_art:empty::before {
      content: "♥";
      font: 700 46px Georgia, serif;
      color: #e7e7e8;
      text-shadow: 0 2px 12px #000;
    }

    #sonic_art img {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      border-radius: 50%;
    }

    .live {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: 6px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 99px;
      color: #fff;
      background: rgba(15,16,18,.86);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .13em;
    }

    .live::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f4f4f4;
      box-shadow: 0 0 8px #fff;
      animation: pulse 1.6s ease-in-out infinite;
    }

    .info {
      min-width: 0;
      align-self: center;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    #sonic_title {
      min-height: 2.5em;
      margin: 0;
      overflow: hidden;
      color: var(--silver);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(21px, 5vw, 29px);
      font-weight: 500;
      line-height: 1.08;
      text-wrap: balance;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 13px;
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .meta span { white-space: nowrap; }
    .meta b { color: #f4f4f5; font-weight: 650; }

    .clock {
      display: block;
      margin-top: 8px;
      color: #fff;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .04em;
      text-shadow: 0 1px 6px #000;
    }

    .controls {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 46px 1fr auto;
      align-items: center;
      gap: 12px;
      padding-top: 3px;
    }

    .play, .reload, .skip {
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      color: #17181b;
      background: linear-gradient(#fff, #b9bbc0);
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,.25), inset 0 1px 0 white;
      transition: transform .2s ease, filter .2s ease;
    }

    .play {
      width: 46px;
      height: 46px;
      border-radius: 50%;
    }

    .skip {
      width: 34px;
      height: 34px;
      border-radius: 12px;
    }

    .reload {
      width: 38px;
      height: 38px;
      border-radius: 50%;
    }

    .play:hover, .reload:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .play:active, .reload:active { transform: translateY(1px) scale(.98); }
    .play:focus-visible, .reload:focus-visible, input:focus-visible { outline: 2px solid white; outline-offset: 3px; }

    .play svg, .reload svg, .skip svg { width: 20px; height: 20px; fill: currentColor; }
    .pause-icon { display: none; }
    .is-playing .play-icon { display: none; }
    .is-playing .pause-icon { display: block; }

    .status {
      min-width: 0;
      color: #e7e7e8;
      font-size: 12px;
    }

    .status strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 650;
    }

    .status small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
    }

    .volume {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="range"] {
      width: 82px;
      height: 4px;
      border-radius: 99px;
      appearance: none;
      background: rgba(255,255,255,.26);
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 13px;
      height: 13px;
      border: 0;
      border-radius: 50%;
      appearance: none;
      background: white;
      box-shadow: 0 1px 6px #000;
    }

    input[type="range"]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border: 0;
      border-radius: 50%;
      background: white;
    }

    .particle {
      position: absolute;
      z-index: -1;
      bottom: -24px;
      color: rgba(255,255,255,.26);
      font-family: Georgia, serif;
      animation: float 8s linear infinite;
      pointer-events: none;
    }

    .p1 { left: 7%; font-size: 18px; animation-delay: -1s; }
    .p2 { left: 48%; font-size: 23px; animation-delay: -5s; animation-duration: 10s; }
    .p3 { left: 84%; font-size: 16px; animation-delay: -3s; animation-duration: 7s; }
    .p4 { left: 67%; font-size: 20px; animation-delay: -7s; animation-duration: 11s; }

    @keyframes float {
      0% { transform: translateY(0) rotate(-8deg) scale(.8); opacity: 0; }
      15% { opacity: .75; }
      80% { opacity: .3; }
      100% { transform: translateY(-340px) rotate(18deg) scale(1.15); opacity: 0; }
    }

    @keyframes shine {
      0%, 60% { transform: translateX(-100%); }
      80%, 100% { transform: translateX(120%); }
    }

    @keyframes pulse {
      50% { opacity: .4; transform: scale(.72); }
    }

    @media (max-width: 460px) {
      body { padding: 6px; }
      .player { border-radius: 22px; }
      .content { grid-template-columns: 96px 1fr; gap: 14px; padding: 20px; }
      .cover { width: 96px; }
      #sonic_title { font-size: 20px; }
      .controls { grid-template-columns: 44px 1fr auto; gap: 9px; }
      .play { width: 44px; height: 44px; }
      input[type="range"] { width: 58px; }
      .meta { gap: 5px 9px; }
    }

    @media (max-width: 350px) {
      .content { grid-template-columns: 76px 1fr; padding: 16px; }
      .cover { width: 76px; }
      .volume input { display: none; }
      .meta span:first-child { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
    /* El reproductor toma la silueta de los corazones; el exterior queda transparente. */
    .player {
      width: min(100%, 560px);
      min-height: 0;
      aspect-ratio: 1;
      overflow: visible;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .shine { display: none; }

    .content {
      position: relative;
      z-index: 2;
      display: block;
      width: 100%;
      height: 100%;
      padding: 0;
    }

    .cover {
      position: absolute;
      top: 15%;
      left: 50%;
      width: 116px;
      transform: translateX(-50%);
      border: 2px solid rgba(255,255,255,.7);
      box-shadow: 0 10px 26px rgba(0,0,0,.55), inset 0 0 0 6px rgba(0,0,0,.22);
    }

    .info {
      position: absolute;
      top: 42%;
      right: 16%;
      left: 16%;
      padding: 25px 20px 34px;
      text-align: center;
      background: radial-gradient(ellipse at center, rgba(6,7,9,.9) 0 42%, rgba(10,11,13,.67) 58%, transparent 74%);
    }

    .eyebrow {
      margin-bottom: 5px;
      color: #e7e7e8;
      text-shadow: 0 1px 7px #000;
    }

    #sonic_title {
      min-height: 2.2em;
      color: #fff;
      font-size: clamp(20px, 4.8vw, 27px);
      line-height: 1.08;
      text-shadow: 0 2px 8px #000, 0 0 16px #000;
    }

    .meta {
      justify-content: center;
      margin-top: 9px;
      color: #d2d3d6;
      text-shadow: 0 1px 5px #000;
    }

    .controls {
      position: absolute;
      right: 11%;
      bottom: 12%;
      left: 11%;
      display: grid;
      grid-template-columns: 46px 38px 1fr auto;
      gap: 12px;
      padding: 0;
      border-radius: 0;
      background: none;
      filter: none;
    }

    .status small, .status strong { text-shadow: 0 1px 4px #000; }

    .particle {
      z-index: 1;
      color: rgba(255,255,255,.72);
      text-shadow: 0 1px 6px #000;
    }

    @media (max-width: 460px) {
      .player { border-radius: 0; }
      .content { display: block; padding: 0; }
      .cover { top: 16%; width: 88px; }
      .info { top: 41%; right: 12%; left: 12%; padding: 18px 12px 26px; }
      #sonic_title { font-size: clamp(17px, 5.5vw, 21px); }
      .meta { gap: 4px 8px; font-size: 9px; }
      .controls { right: 7%; bottom: 11%; left: 7%; grid-template-columns: 42px 36px 1fr auto; padding: 0; }
      .play { width: 42px; height: 42px; }
      .reload { width: 36px; height: 36px; }
      input[type="range"] { width: 52px; }
    }

    @media (max-width: 350px) {
      .content { display: block; padding: 0; }
      .cover { width: 72px; }
      .info { top: 39%; }
      .controls { right: 5%; bottom: 9%; left: 5%; }
    }

    .controls {
      right: auto;
      bottom: 11%;
      left: 50%;
      display: block;
      transform: translateX(-50%);
    }

    .audio-buttons {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .play, .reload, .skip {
      width: 42px;
      height: 42px;
      border-radius: 50%;
    }

    .volume {
      position: absolute;
      right: 6%;
      bottom: 14%;
      z-index: 4;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      text-shadow: 0 1px 5px #000;
    }

    .history {
      position: absolute;
      bottom: 13%;
      left: 6%;
      z-index: 6;
      color: #fff;
      font-size: 11px;
    }

    .history summary {
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 999px;
      color: #17181b;
      background: linear-gradient(#fff, #b9bbc0);
      box-shadow: 0 5px 14px rgba(0,0,0,.28);
      font-weight: 750;
      list-style: none;
      cursor: pointer;
    }

    .history summary::-webkit-details-marker { display: none; }

    #sonic_history {
      position: absolute;
      bottom: 44px;
      left: 0;
      width: min(270px, 76vw);
      max-height: 150px;
      overflow: auto;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 14px;
      background: rgba(8,9,11,.91);
      box-shadow: 0 10px 24px rgba(0,0,0,.35);
      line-height: 1.55;
      text-align: left;
    }

    .clock {
      position: absolute;
      bottom: 3%;
      left: 50%;
      z-index: 4;
      margin: 0;
      transform: translateX(-50%);
      color: #fff;
      white-space: nowrap;
    }

    @media (max-width: 460px) {
      .controls { right: auto; bottom: 11%; left: 50%; padding: 0; }
      .play, .reload, .skip { width: 38px; height: 38px; }
      .audio-buttons { gap: 7px; }
      .volume { right: 3%; bottom: 14%; }
      .history { bottom: 13%; left: 3%; }
      .history summary { padding: 7px 9px; font-size: 9px; }
      .clock { bottom: 2.5%; font-size: 9px; }
    }
    html, body { background-color: transparent !important; }

    .audio-buttons { gap: 11px; }

    .play, .reload, .skip {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.8);
      color: #17181b;
      background: linear-gradient(145deg, #fff 4%, #d7d8dc 36%, #858990 72%, #f5f5f6 100%);
      box-shadow:
        0 8px 18px rgba(0,0,0,.38),
        inset 0 2px 2px rgba(255,255,255,.95),
        inset 0 -2px 3px rgba(0,0,0,.22);
    }

    .play { width: 50px; height: 50px; }
    .reload, .skip { width: 42px; height: 42px; }

    .play::after, .reload::after, .skip::after {
      content: "";
      position: absolute;
      inset: 3px 5px 55%;
      border-radius: 50%;
      background: rgba(255,255,255,.4);
      pointer-events: none;
    }

    .play:hover, .reload:hover {
      filter: brightness(1.12);
      box-shadow: 0 10px 22px rgba(0,0,0,.45), inset 0 2px 2px #fff;
    }

    .play svg, .reload svg, .skip svg {
      position: relative;
      z-index: 1;
      width: 18px;
      height: 18px;
    }

    .play svg { width: 21px; height: 21px; }

    .volume {
      gap: 9px;
      padding: 7px 10px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      background: rgba(18,19,22,.34);
      box-shadow: 0 5px 16px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.12);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .volume svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      fill: #fff;
      filter: drop-shadow(0 1px 3px #000);
    }

    .volume .volume-low { width: 15px; height: 15px; opacity: .82; }

    .volume input[type="range"] {
      --volume: 80%;
      width: 105px;
      height: 5px;
      border: 1px solid rgba(255,255,255,.16);
      background: linear-gradient(90deg, #f8f8f9 0 var(--volume), rgba(255,255,255,.2) var(--volume) 100%);
      box-shadow: inset 0 1px 3px rgba(0,0,0,.6);
    }

    .volume input[type="range"]::-webkit-slider-thumb {
      width: 17px;
      height: 17px;
      border: 2px solid #fff;
      background: linear-gradient(145deg, #fff, #9da0a6);
      box-shadow: 0 2px 7px rgba(0,0,0,.55);
    }

    .volume input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border: 2px solid #fff;
      background: linear-gradient(145deg, #fff, #9da0a6);
      box-shadow: 0 2px 7px rgba(0,0,0,.55);
    }

    .history summary {
      padding: 9px 14px;
      border-color: rgba(255,255,255,.75);
      background: linear-gradient(145deg, #fff, #c9cbd0 48%, #8d9096);
      box-shadow: 0 7px 16px rgba(0,0,0,.32), inset 0 1px 1px #fff;
      letter-spacing: .03em;
    }

    @media (max-width: 460px) {
      .play { width: 44px; height: 44px; }
      .reload, .skip { width: 38px; height: 38px; }
      .audio-buttons { gap: 8px; }
      .volume { gap: 6px; padding: 6px 8px; }
      .volume input[type="range"] { width: 68px; }
    }
    .controls {
      top: 64%;
      right: auto;
      bottom: auto;
      left: 50%;
    }

    .audio-buttons { gap: 8px; }

    .play, .reload, .skip {
      width: 40px;
      height: 40px;
      border-color: rgba(255,255,255,.65);
      background: linear-gradient(150deg, #fafafa 0%, #d3d5d9 42%, #7d8188 100%);
      box-shadow: 0 6px 14px rgba(0,0,0,.35), inset 0 1px 2px #fff;
    }

    .play { width: 46px; height: 46px; }

    .volume {
      top: 8%;
      right: 5%;
      bottom: auto;
      padding: 7px 11px;

    .volume .volume-low { display: none; }
    .volume input[type="range"] { width: 88px; }

    .history {
      top: 8%;
      bottom: auto;

    .history summary {
      padding: 8px 13px;

      box-shadow: 0 6px 14px rgba(0,0,0,.3), inset 0 1px 1px #fff;
    }

    #sonic_history {
      top: 44px;
      bottom: auto;
    }

    @media (max-width: 460px) {
      .controls { top: 63%; right: auto; bottom: auto; left: 50%; }
      .play { width: 42px; height: 42px; }
      .reload, .skip { width: 36px; height: 36px; }

    .bolt {
      position: absolute;
      z-index: 1;
      color: #f4f4f5;
      font: 700 44px/1 Georgia, serif;
      opacity: 0;
      text-shadow: 0 0 4px #fff, 0 0 14px rgba(255,255,255,.9), 0 0 28px rgba(190,205,255,.75);
      animation: lightning 6s infinite;
      pointer-events: none;
    }

    .b1 { top: 28%; left: 8%; transform: rotate(-18deg); animation-delay: -1s; }
    .b2 { top: 38%; right: 7%; transform: rotate(16deg) scale(.8); animation-delay: -3.7s; }
    .b3 { top: 69%; left: 16%; transform: rotate(-10deg) scale(.65); animation-delay: -5.1s; }

    @keyframes lightning {
      0%, 82%, 85%, 88%, 100% { opacity: 0; }
      83% { opacity: .95; }
      84% { opacity: .12; }
      86% { opacity: .72; }
      87% { opacity: .08; }
    }

    .player::after {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 8%;
      border-radius: 50%;
      background: radial-gradient(circle, transparent 52%, rgba(255,255,255,.08) 58%, transparent 66%);
      opacity: .5;
      animation: aura 4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes aura {
      50% { opacity: .9; transform: scale(1.035); filter: brightness(1.35); }
    }
    .history-panel { display: none; }

    .history[open] {
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 30;
    }

    .history[open] > summary { display: none; }

    .history[open] .history-panel {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 54px 48px 42px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 42% 42% 46% 46% / 34% 34% 54% 54%;
      color: #fff;
      background:
        radial-gradient(circle at 50% 28%, rgba(70,72,78,.48), transparent 34%),
        rgba(8,9,11,.94);
      box-shadow: inset 0 0 45px rgba(255,255,255,.08), 0 18px 45px rgba(0,0,0,.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .history-panel h2 {
      margin: 0 42px 18px;
      color: #fff;
      font: 600 clamp(22px, 5vw, 30px)/1.1 Georgia, serif;
      text-align: center;
      text-shadow: 0 2px 10px #000;
    }

    .history-close {
      position: absolute;
      top: 22px;
      right: 28px;
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      padding: 0 0 3px;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 50%;
      color: #18191c;
      background: linear-gradient(145deg, #fff, #c4c6cb 58%, #83878e);
      box-shadow: 0 7px 18px rgba(0,0,0,.4), inset 0 1px 1px #fff;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
    }

    .history-close:hover { filter: brightness(1.12); transform: scale(1.04); }
    .history-close:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    .history[open] #sonic_history {
      position: static;
      width: 100%;
      max-height: none;
      flex: 1;
      overflow: auto;
      padding: 16px 20px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 20px;
      color: #f2f2f3;
      background: rgba(0,0,0,.28);
      box-shadow: inset 0 1px 10px rgba(0,0,0,.3);
      font-size: 12px;
      line-height: 1.8;
      scrollbar-color: #d9dadd rgba(255,255,255,.08);
    }

    @media (max-width: 460px) {
      .history[open] .history-panel {
        padding: 48px 28px 34px;
        border-radius: 36% 36% 44% 44% / 28% 28% 50% 50%;
      }
      .history-close { top: 18px; right: 20px; width: 34px; height: 34px; }
      .history-panel h2 { margin-bottom: 12px; font-size: 21px; }
      .history[open] #sonic_history { padding: 12px 14px; font-size: 10px; }
    }
    .live {
      bottom: -4px;
      width: 76%;
      min-height: 38px;
      flex-direction: column;
      justify-content: center;
      gap: 0;
      padding: 6px 8px 8px;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 48% 52% 46% 54% / 68% 64% 40% 44%;
      background: linear-gradient(160deg, rgba(42,44,49,.96), rgba(5,6,8,.96) 62%);
      box-shadow: 0 6px 12px rgba(0,0,0,.45), inset 0 1px 2px rgba(255,255,255,.25);
      font-size: 9px;
      line-height: .92;
      text-align: center;
      transform: translateX(-50%) rotate(-1.5deg);
    }

    .live::before { display: none; }

    .live::after {
      content: "";
      position: absolute;
      right: -7px;
      bottom: 3px;
      left: -7px;
      height: 29px;
      border-top: 1px solid rgba(255,255,255,.38);
      border-radius: 50%;
      pointer-events: none;
    }

    .live span { display: block; }

    @media (max-width: 460px) {
      .live { min-height: 31px; padding: 5px 6px 6px; font-size: 8px; }
    }
    .history[open] .history-panel {
      border: 0;
      border-radius: 0;
      background: rgba(8,9,11,.96);
      box-shadow: none;
    }
    .star {
      position: absolute;
      z-index: 1;
      color: rgba(255,255,255,.92);
      text-shadow: 0 0 5px #fff, 0 0 13px rgba(205,215,255,.9);
      animation: twinkle 3.2s ease-in-out infinite;
      pointer-events: none;
    }

    .s1 { top: 12%; left: 14%; font-size: 17px; animation-delay: -.4s; }
    .s2 { top: 23%; right: 13%; font-size: 13px; animation-delay: -1.8s; }
    .s3 { top: 48%; left: 7%; font-size: 9px; animation-delay: -2.6s; }
    .s4 { top: 57%; right: 8%; font-size: 16px; animation-delay: -1.1s; }
    .s5 { bottom: 20%; left: 20%; font-size: 12px; animation-delay: -2.2s; }
    .s6 { bottom: 14%; right: 22%; font-size: 8px; animation-delay: -.8s; }

    .glitter {
      position: absolute;
      z-index: 1;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #fff;
      box-shadow:
        24px 18px 0 rgba(255,255,255,.85),
        52px -8px 0 rgba(215,225,255,.7),
        76px 34px 0 rgba(255,255,255,.95),
        103px 7px 0 rgba(220,225,235,.72),
        128px 42px 0 rgba(255,255,255,.8);
      filter: drop-shadow(0 0 4px #fff);
      animation: glitter 4s ease-in-out infinite;
      pointer-events: none;
    }

    .g1 { top: 20%; left: 8%; animation-delay: -.7s; }
    .g2 { top: 50%; right: 27%; transform: rotate(100deg); animation-delay: -2.4s; }
    .g3 { bottom: 20%; left: 27%; transform: rotate(-22deg); animation-delay: -3.2s; }

    @keyframes twinkle {
      0%, 100% { opacity: .18; transform: scale(.55) rotate(0); }
      45% { opacity: 1; transform: scale(1.25) rotate(16deg); }
      65% { opacity: .42; transform: scale(.82) rotate(22deg); }
    }

    @keyframes glitter {
      0%, 100% { opacity: .12; filter: drop-shadow(0 0 2px #fff); }
      35% { opacity: .95; filter: drop-shadow(0 0 7px #fff); }
      62% { opacity: .3; }
      78% { opacity: .8; }
    }

    .player::before {
      background-image: url("https://xatimg.com/image/2Fe6ZBoxIXfB.png");
    }
    .history[open] .history-panel {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    .history[open] .history-panel {
      background: rgba(8,9,11,.34);
      backdrop-filter: blur(13px) saturate(.72) brightness(.72);
      -webkit-backdrop-filter: blur(13px) saturate(.72) brightness(.72);
    }

    .history[open] #sonic_history {
      background: rgba(5,6,8,.58);
      box-shadow: inset 0 1px 12px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.2);
    }
    .history[open] #sonic_history {
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      text-shadow: 0 1px 4px rgba(0,0,0,.9);
    }
  </style>
</head>
<body>
  <main class="player" aria-label="Reproductor de radio">
    <div class="shine"></div>
    <span class="particle p1" aria-hidden="true">♥</span>
    <span class="particle p2" aria-hidden="true">♪</span>
    <span class="particle p3" aria-hidden="true">♡</span>
    <span class="particle p4" aria-hidden="true">♫</span>
    <span class="particle p5" aria-hidden="true">♥</span>
    <span class="particle p6" aria-hidden="true">♬</span>
    <span class="particle p7" aria-hidden="true">♡</span>
    <span class="particle p8" aria-hidden="true">♪</span>
    <span class="particle p9" aria-hidden="true">♥</span>
    <span class="particle p10" aria-hidden="true">♫</span>
    <span class="bolt b1" aria-hidden="true">ϟ</span>
    <span class="bolt b2" aria-hidden="true">ϟ</span>
    <span class="bolt b3" aria-hidden="true">ϟ</span>
    <span class="star s1" aria-hidden="true">✦</span>
    <span class="star s2" aria-hidden="true">✧</span>
    <span class="star s3" aria-hidden="true">★</span>
    <span class="star s4" aria-hidden="true">✦</span>
    <span class="star s5" aria-hidden="true">✧</span>
    <span class="star s6" aria-hidden="true">★</span>
    <span class="glitter g1" aria-hidden="true"></span>
    <span class="glitter g2" aria-hidden="true"></span>
    <span class="glitter g3" aria-hidden="true"></span>

    <div class="content">
      <div class="cover">
        <div id="sonic_art" aria-label="Portada de la canción"></div>
        <span class="live"><span>EN</span><span>VIVO</span></span>
      </div>

      <section class="info" aria-live="polite">
        <p class="eyebrow">Ahora suena</p>
        <h1 id="sonic_title">Conectando con la radio…</h1>
        <div class="meta">
          <span>DJ: <b id="sonic_dj">—</b></span>
          <span>Oyentes: <b id="sonic_listeners">—</b></span>
          <span><b id="sonic_bitrate">—</b> kbps</span>
        </div>
      </section>

      <div class="controls">
        <div class="audio-buttons">
          <button class="play" type="button" aria-label="Reproducir radio" aria-pressed="false">
            <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          </button>

          <button class="reload" type="button" aria-label="Recargar la señal">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.1A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg>
          </button>

          <button class="skip" type="button" aria-label="Siguiente canción, botón decorativo" aria-disabled="true" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14l10-7L5 5zm11 0h3v14h-3z"/></svg>
          </button>
        </div>
      </div>

      <label class="volume" aria-label="Control de volumen">
        <svg class="volume-low" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm11 3a3 3 0 0 0-1.5-2.6v5.2A3 3 0 0 0 15 12z"/></svg>
        <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="Volumen">
        <svg class="volume-high" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm11.5 3A3.5 3.5 0 0 0 13 9.13v5.74A3.5 3.5 0 0 0 14.5 12zM13 4.3v2.06a6 6 0 0 1 0 11.28v2.06A8 8 0 0 0 13 4.3z"/></svg>
      </label>

      <details class="history">
        <summary>Historial</summary>
        <section class="history-panel" aria-label="Historial musical">
          <button class="history-close" type="button" aria-label="Cerrar historial">×</button>
          <h2>Historial musical</h2>
          <div id="sonic_history">Cargando historial…</div>
        </section>
      </details>

      <time id="clock" class="clock" aria-label="Fecha y hora"></time>
    </div>

    <audio id="radio" preload="auto" autoplay src="https://technoplayerserver.net/8226/stream"></audio>
  </main>

  <script>
    (() => {
      const player = document.querySelector(".player");
      const audio = document.getElementById("radio");
      const play = document.querySelector(".play");
      const reload = document.querySelector(".reload");
      const volume = document.getElementById("volume");
      const clock = document.getElementById("clock");
      const history = document.querySelector(".history");
      const closeHistory = document.querySelector(".history-close");
      const title = document.getElementById("sonic_title");
      const art = document.getElementById("sonic_art");
      const dj = document.getElementById("sonic_dj");
      const listeners = document.getElementById("sonic_listeners");
      const bitrate = document.getElementById("sonic_bitrate");
      const historyList = document.getElementById("sonic_history");

      const updateMetadata = async () => {
        try {
          const response = await fetch("https://technoplayerserver.net/cp/get_info.php?p=8226", { cache: "no-store" });
          if (!response.ok) throw new Error(`Metadata HTTP ${response.status}`);
          const data = await response.json();

          title.textContent = data.title || "Sin información";
          const djName = String(data.djusername || "").trim();
          dj.textContent = !djName || /^no\s*dj$/i.test(djName) ? "AutoDj" : djName;
          listeners.textContent = data.listeners ?? "0";
          bitrate.textContent = data.bitrate ?? "—";

          if (data.art) {
            const cover = new Image();
            cover.alt = "";
            cover.src = `${data.art}${data.art.includes("?") ? "&" : "?"}r=${Date.now()}`;
            cover.addEventListener("load", () => art.replaceChildren(cover), { once: true });
          }

          const items = Array.isArray(data.history) ? data.history : [];
          historyList.replaceChildren(...items.map(item => {
            const row = document.createElement("div");
            row.textContent = String(item).replace(/<br\s*\/?>/gi, "").trim();
            return row;
          }));
        } catch (error) {
          console.warn("No se pudo actualizar la metadata:", error);
        }
      };

      updateMetadata();
      setInterval(updateMetadata, 10000);

      audio.volume = Number(volume.value);
      volume.style.setProperty("--volume", `${audio.volume * 100}%`);
      audio.play().catch(() => {
        play.setAttribute("aria-label", "Reproducir radio; el navegador bloqueó el inicio automático");
      });

      play.addEventListener("click", async () => {
        if (!audio.paused) {
          audio.pause();
          return;
        }

        try {
          await audio.play();
        } catch {
          play.setAttribute("aria-label", "Reintentar conexión");
        }
      });

      reload.addEventListener("click", async () => {
        audio.load();
        try {
          await audio.play();
        } catch {
          reload.setAttribute("aria-label", "Reintentar recarga de la señal");
        }
      });

      const updateClock = () => {
        clock.textContent = new Date().toLocaleString("es-CO", {
          weekday: "short",
          day: "2-digit",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
      };
      updateClock();
      setInterval(updateClock, 1000);

      closeHistory.addEventListener("click", () => {
        history.open = false;
      });

      volume.addEventListener("input", () => {
        audio.volume = Number(volume.value);
        volume.style.setProperty("--volume", `${audio.volume * 100}%`);
      });

      audio.addEventListener("playing", () => {
        player.classList.add("is-playing");
        play.setAttribute("aria-pressed", "true");
        play.setAttribute("aria-label", "Pausar radio");
      });

      audio.addEventListener("pause", () => {
        player.classList.remove("is-playing");
        play.setAttribute("aria-pressed", "false");
        play.setAttribute("aria-label", "Reproducir radio");
      });

      audio.addEventListener("error", () => {
        player.classList.remove("is-playing");
        play.setAttribute("aria-label", "Señal no disponible; reintentar");
      });
    })();
  </script>
</body>
</html>
